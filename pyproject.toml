# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

[project]
name = "linux-rag"
version = "0.1.0"
description = "Local-first Linux RAG assistant services and tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.75.1",
    "grpcio-tools>=1.75.1",
    "PyYAML>=6.0",
    "weaviate-client>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
    "black>=24.3",
    "mypy>=1.10",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "black>=24.3",
    "mypy>=1.10",
    "grpcio-testing>=1.75.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
