syntax = "proto3";

package linuxrag.v1;

// RAG retrieval and admin service consumed by the Go CLIs.
service RagService {
  // Submit a natural-language query and receive an answer with citations.
  rpc Ask(AskRequest) returns (AskResponse);

  // Trigger ingestion for man pages and selected wiki archives.
  rpc RunIngestion(RunIngestionRequest) returns (RunIngestionResponse);

  // Provide current system status including cache usage and index freshness.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Record user feedback for a prior answer session.
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);

  // Manage lifecycle of the knowledge stack (start, stop, restart).
  rpc ControlStack(ControlStackRequest) returns (ControlStackResponse);
}

message AskRequest {
  string query_text = 1;
  repeated string context_hints = 2; // Optional keywords to bias retrieval
  string preferred_model = 3;        // "gemma3:1b" or "codegemma:2b"
  bool allow_cache = 4;              // When false, force fresh generation
}

message AskResponse {
  string session_id = 1;
  string answer_text = 2;
  repeated Citation citations = 3;
  bool cache_hit = 4;
  int64 response_time_ms = 5;
}

message Citation {
  string source_id = 1;
  string title = 2;
  string snippet = 3;
  string source_path = 4;
}

message RunIngestionRequest {
  repeated string wiki_archive_ids = 1; // Selected Kiwix archive identifiers
  bool refresh_man_pages = 2;
}

message RunIngestionResponse {
  string job_id = 1;
  int64 man_pages_processed = 2;
  int64 wiki_articles_processed = 3;
  repeated IngestionError errors = 4;
}

message IngestionError {
  string source = 1;
  string error_message = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  string latest_job_id = 1;
  string latest_job_status = 2;   // running, completed, failed
  string latest_job_completed_at = 3; // ISO timestamp
  double cache_disk_pct = 4;      // 0-100
  int64 cache_hit_rate = 5;       // Percent
  repeated string active_models = 6;
}

message SubmitFeedbackRequest {
  string session_id = 1;
  string rating = 2;  // positive, neutral, negative
  string comment = 3;
}

message SubmitFeedbackResponse {
  string feedback_id = 1;
  string status = 2; // open, triaged, resolved
}

message ControlStackRequest {
  string action = 1;          // start, stop, restart
  string compose_file = 2;    // optional override for podman-compose path
  string config_path = 3;     // optional Python server config
}

message ControlStackResponse {
  string action = 1;          // echo of requested action
  string status = 2;          // success, failed, in_progress
  string message = 3;         // human-readable details
}
